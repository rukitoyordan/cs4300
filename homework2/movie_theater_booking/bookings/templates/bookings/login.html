{% extends "bookings/base.html" %}

{% block title %}Sign In | Movie Theater Booking{% endblock %}

{% block content %}
<section class="surface-card mx-auto" style="max-width: 28rem;">
    <h2 class="h3 fw-bold mb-3">Sign in</h2>
    <p class="text-muted-custom">Sign in before booking a seat.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary" type="submit">Sign In</button>
    </form>
</section>
{% endblock %}
