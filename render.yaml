databases:
  - name: movie-theater-booking-db
    plan: free
    region: ohio

services:
  - type: web
    name: movie-theater-booking
    runtime: python
    plan: free
    region: ohio
    rootDir: homework2
    buildCommand: pip install -r requirements.txt && python movie_theater_booking/manage.py collectstatic --noinput
    startCommand: cd movie_theater_booking && python manage.py migrate --noinput && python manage.py seed_demo && gunicorn movie_theater_booking.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        fromDatabase:
          name: movie-theater-booking-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
